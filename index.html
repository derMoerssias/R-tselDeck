<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ifwecountgates Download</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .container {
            background: rgba(20,20,20,0.93);
            padding: 32px 16px 24px 16px;
            border-radius: 16px;
            box-shadow: 0 0 24px 0 #222;
            display: inline-block;
        }
        .emoticon {
            font-size: 2.2em;
            margin-bottom: 16px;
        }
        .download-link {
            display: inline-block;
            margin: 16px 0;
            padding: 8px 20px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 7px;
            font-size: 1.16em;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-link:hover {
            background: #444;
        }
        .input-section {
            margin-top: 28px;
        }
        .label-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 8px;
        }
        .password-input {
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 1em;
            width: 160px;
            margin-right: 12px;
        }
        .submit-btn {
            padding: 8px 18px;
            border-radius: 7px;
            border: none;
            background: #333;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #555;
        }
        .error {
            color: #fd5252;
            margin-top: 9px;
            font-size: 0.97em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoticon" aria-label="books">📚</div>
        <a class="download-link" href="Ifwecountgates.pdf" download>Ifwecountgates</a>
        <div class="input-section">
            <div class="label-row">
                <span>insert password</span>
                <!-- Removed the book emoji here -->
            </div>
            <input class="password-input" type="password" id="password" placeholder="Password">
            <button class="submit-btn" id="submitBtn">submit</button>
            <div id="error" class="error" style="display:none;"></div>
        </div>
    </div>
    <script>
        document.getElementById('submitBtn').addEventListener('click', function() {
            var password = document.getElementById('password').value;
            var errorBox = document.getElementById('error');
            if(password === '1003') {
                errorBox.style.display = 'none';
                // Start download of WebsiteChessWincons.pdf
                var link = document.createElement('a');
                link.href = 'WebsiteChessWincons.pdf';
                link.download = 'WebsiteChessWincons.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                errorBox.textContent = "Incorrect password.";
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
